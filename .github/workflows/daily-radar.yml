name: Daily Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
  push:
    branches:
      - main
    paths:
      - 'radar/**'
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/daily-radar.yml'

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/run_radar.py

      - name: Commit updated opportunity data
        run: |
          if git diff --quiet -- data/opportunities.json docs/opportunities.json docs/source-health.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "opportunity-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json docs/opportunities.json docs/source-health.json
          git commit -m "Update opportunity radar data"
          git push
