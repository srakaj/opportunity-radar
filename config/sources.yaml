greenhouse:
  enabled: true
  boards:
    - token: via
      name: Via
    - token: wikimedia
      name: Wikimedia Foundation
    - token: civicactions
      name: CivicActions
    - token: legalist
      name: Legalist
    - token: relativity
      name: Relativity
    - token: scaleai
      name: Scale AI
    - token: checkr
      name: Checkr
    - token: axiom
      name: Axiom

lever:
  enabled: true
  sites:
    - site: spotify
      name: Spotify
      instance: global

# Ashby has a public job-board endpoint and is common among newer AI/legal-tech
# companies. These are high-value direct employer sources, not search-engine hits.
ashby:
  enabled: true
  boards:
    - board: harvey
      name: Harvey
    - board: legora
      name: Legora

reliefweb:
  enabled: true
  appname: opportunity-radar
  max_results_per_query: 20
  queries:
    - legal
    - policy
    - human rights
    - protection

# GitHub Issues are useful for unusual extracurricular work that conventional
# job boards almost never surface: open-source legal tech, documentation,
# governance, privacy and civic-tech contributions.
github:
  enabled: true
  max_results_per_query: 20
  queries:
    - 'legal label:"help wanted"'
    - 'privacy label:"help wanted"'
    - 'gdpr label:"help wanted"'
    - 'governance label:"help wanted"'
    - '"legal tech" label:"help wanted"'
    - '"open data" label:"help wanted"'
    - '"civic tech" label:"help wanted"'
    - 'legal label:"good first issue"'

# A curated set of organisations worth watching even when they do not expose a
# supported public ATS endpoint. Search results pointing to these official domains
# receive higher source quality than generic web discovery.
watchlist:
  enabled: true
  max_queries_per_run: 13
  query_terms: '(legal OR privacy OR compliance OR policy OR governance OR "legal tech" OR "AI governance") (job OR career OR fellowship OR internship OR trainee OR "working student" OR graduate)'
  organizations:
    - name: BRYTER
      domain: bryter.com
    - name: Juro
      domain: juro.com
    - name: Robin AI
      domain: robinai.com
    - name: Luminance
      domain: luminance.com
    - name: Ironclad
      domain: ironcladapp.com
    - name: Clio
      domain: clio.com
    - name: ContractPodAi
      domain: contractpodai.com
    - name: Access Now
      domain: accessnow.org
    - name: noyb
      domain: noyb.eu
    - name: EDRi
      domain: edri.org
    - name: AlgorithmWatch
      domain: algorithmwatch.org
    - name: Ada Lovelace Institute
      domain: adalovelaceinstitute.org
    - name: Privacy International
      domain: privacyinternational.org
