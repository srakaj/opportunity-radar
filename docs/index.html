<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Opportunity Radar</title>
  <link rel="stylesheet" href="style.css?v=20260917-040">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">SRakaj · Opportunity Radar · UI 0.4.0</p>
      <h1>High-signal opportunities, without the search-engine noise.</h1>
      <p class="lede">Legal, policy, privacy, compliance, AI governance, research and international opportunities ranked by relevance and personal fit.</p>
    </header>

    <section class="toolbar" aria-label="Opportunity filters">
      <input id="search" type="search" placeholder="Search title, topic, organisation…" aria-label="Search opportunities">
      <select id="fitFilter" aria-label="Personal fit">
        <option value="all" selected>All fit levels</option>
        <option value="Strong fit">Strong fit</option>
        <option value="Stretch">Stretch</option>
        <option value="Probably skip">Probably skip</option>
      </select>
      <select id="minScore" aria-label="Minimum relevance score">
        <option value="0" selected>All relevance scores</option>
        <option value="40">40+</option>
        <option value="60">60+</option>
        <option value="80">80+</option>
      </select>
      <label class="check-filter"><input id="newOnly" type="checkbox"> New in last 7 days</label>
    </section>

    <section class="stats" id="stats" aria-live="polite"></section>
    <section id="results" class="results"></section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="content">
        <div class="card-head">
          <div class="heading-block">
            <div class="topline"></div>
            <h2><a class="title" target="_blank" rel="noopener"></a></h2>
          </div>

          <div class="card-actions">
            <div class="fit-badge" aria-label="Personal fit">
              <span class="fit-label-text"></span>
              <strong class="fit-score-value"></strong>
            </div>
            <div class="score-badge" aria-label="Relevance score">
              <span class="score-label">Relevance</span>
              <strong class="score-value"></strong>
            </div>
            <a class="open-role" target="_blank" rel="noopener">Open role ↗</a>
          </div>
        </div>

        <div class="meta-grid"></div>

        <section class="fit-panel" aria-label="Personal fit assessment">
          <div class="fit-column fit-positive">
            <h3>Why it fits</h3>
            <ul class="fit-reasons-list"></ul>
          </div>
          <div class="fit-column fit-gaps-column">
            <h3>Watch-outs</h3>
            <ul class="fit-gaps-list"></ul>
          </div>
          <div class="fit-column fit-blockers-column" hidden>
            <h3>Blockers</h3>
            <ul class="fit-blockers-list"></ul>
          </div>
        </section>

        <div class="description-wrap">
          <div class="description"></div>
          <button class="toggle-description" type="button" hidden>Show more</button>
        </div>

        <div class="signals"></div>

        <details>
          <summary>Why this relevance score?</summary>
          <div class="reasons"></div>
        </details>
      </div>
    </article>
  </template>

  <script src="app.js?v=20260917-040"></script>
</body>
</html>
