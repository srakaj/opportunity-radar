<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opportunity Radar</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">SRakaj · Opportunity Radar</p>
      <h1>High-signal opportunities, without the search-engine noise.</h1>
      <p class="lede">Legal, policy, privacy, compliance, AI governance, research and international opportunities ranked by personal relevance.</p>
    </header>

    <section class="toolbar" aria-label="Opportunity filters">
      <input id="search" type="search" placeholder="Search title, topic, organisation…" aria-label="Search opportunities">
      <select id="minScore" aria-label="Minimum relevance score">
        <option value="0" selected>All scores</option>
        <option value="40">40+</option>
        <option value="60">60+</option>
        <option value="80">80+</option>
      </select>
      <label class="check-filter"><input id="newOnly" type="checkbox"> New in last 7 days</label>
    </section>

    <section class="stats" id="stats" aria-live="polite"></section>
    <section id="results" class="results"></section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="content">
        <div class="card-head">
          <div class="heading-block">
            <div class="topline"></div>
            <h2><a class="title" target="_blank" rel="noopener"></a></h2>
          </div>

          <div class="card-actions">
            <div class="score-badge" aria-label="Relevance score">
              <span class="score-label">Match</span>
              <strong class="score-value"></strong>
            </div>
            <a class="open-role" target="_blank" rel="noopener">Open role ↗</a>
          </div>
        </div>

        <div class="meta-grid"></div>

        <div class="description-wrap">
          <div class="description"></div>
          <button class="toggle-description" type="button" hidden>Show more</button>
        </div>

        <div class="signals"></div>

        <details>
          <summary>Why this score?</summary>
          <div class="reasons"></div>
        </details>
      </div>
    </article>
  </template>

  <script src="app.js?v=4"></script>
</body>
</html>
